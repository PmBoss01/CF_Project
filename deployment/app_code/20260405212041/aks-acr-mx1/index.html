<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CF Static HTML Test</title>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🌐 Static HTML — Running</h1>
      <div class="badges">
        <span class="badge teal">Static HTML/CSS/JS</span>
        <span class="badge slate">No framework</span>
      </div>
    </div>
    <section>
      <h3>Deployment Info</h3>
      <ul>
        <li><b>Loaded at:</b> <span id="load-time">—</span></li>
        <li><b>User Agent:</b> <span id="ua">—</span></li>
        <li><b>Viewport:</b> <span id="vp">—</span></li>
        <li><b>Online:</b> <span id="online">—</span></li>
      </ul>
    </section>
    <section>
      <h3>Interactive Test</h3>
      <div class="row">
        <input id="inp" type="text" placeholder="Type something…"/>
        <button onclick="doEcho()">Echo</button>
      </div>
      <p id="out" class="out"></p>
    </section>
    <section>
      <h3>Counter</h3>
      <div class="counter">
        <button onclick="dec()">−</button>
        <span id="count">0</span>
        <button onclick="inc()">+</button>
      </div>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
